<body>
<style>
/* Layout: phone-first single column, sticky day header, fixed bottom tab bar. Routines color-coded like Olympic plates (A=20 kg blue, B=25 kg red, C=15 kg yellow). */
:root{
  --bg:#F1F2F4; --surface:#FFFFFF; --surface-2:#E8EAEE; --ink:#14171C; --muted:#5A616E; --line:#D9DCE2;
  --plate-a:#1E56B8; --plate-b:#C2312A; --plate-c:#B98A00; --plate-ink:#FFFFFF;
  --ok:#1E8A4C; --ok-soft:#DDF1E5; --warn-soft:#FFF1CC; --warn-ink:#7A5600;
  --acc:var(--plate-a);
  --f-display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --f-body:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1013; --surface:#171A1F; --surface-2:#22262D; --ink:#ECEEF1; --muted:#9AA1AD; --line:#2B3038;
  --plate-a:#5B8EF0; --plate-b:#F0625A; --plate-c:#E8B930; --plate-ink:#0E1013;
  --ok:#4CC27F; --ok-soft:#163323; --warn-soft:#3A2F10; --warn-ink:#F2CF6B; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1013; --surface:#171A1F; --surface-2:#22262D; --ink:#ECEEF1; --muted:#9AA1AD; --line:#2B3038;
  --plate-a:#5B8EF0; --plate-b:#F0625A; --plate-c:#E8B930; --plate-ink:#0E1013;
  --ok:#4CC27F; --ok-soft:#163323; --warn-soft:#3A2F10; --warn-ink:#F2CF6B; color-scheme:dark;}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px));}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tnum{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.plate{flex:none;width:52px;height:52px;border-radius:50%;background:var(--acc);color:var(--plate-ink);display:grid;place-items:center;position:relative;
  box-shadow:inset 0 0 0 5px color-mix(in srgb,var(--acc) 70%,#000 30%)}
.plate::after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:var(--bg);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 70%,#000 30%)}
.plate b{font-family:var(--f-display);font-size:13px;position:absolute;top:6px;letter-spacing:.04em}
.plate i{font-style:normal;font-family:var(--f-display);font-weight:800;font-size:12px;position:absolute;bottom:6px;opacity:.85}
.top .meta{min-width:0;flex:1}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;margin:2px 0 0;text-wrap:balance;letter-spacing:.01em}
h2{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.05;margin:0;text-wrap:balance;letter-spacing:.01em}
h3{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:6px 0 0}

/* chips */
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface-2);font-size:12.5px;font-weight:600;color:var(--ink)}
.chip.acc{background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;padding:9px 4px;border-radius:9px;font-weight:700;font-size:14px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}

/* session timeline */
.timeline{display:flex;height:8px;border-radius:99px;overflow:hidden;gap:2px}
.timeline span{display:block;height:100%}
.tl-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.tl-legend b{color:var(--ink);font-weight:600}
.sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:1px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.ex{position:relative}
.ex.done{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.ex-head{display:flex;gap:10px;align-items:flex-start}
.ex-num{flex:none;font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1;color:var(--acc);width:24px;padding-top:2px}
.ex-title{min-width:0;flex:1}
.ex-name{font-weight:700;font-size:16px;line-height:1.25}
.machine{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:13px;color:var(--muted)}
.machine strong{color:var(--ink);font-weight:600}
.mico{flex:none;width:16px;height:16px;color:var(--acc)}
.new{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--warn-soft);color:var(--warn-ink);padding:2px 7px;border-radius:6px;white-space:nowrap}
.rx{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:8px}
.rx .restc{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px}
.rx .restc .rc{margin:0;gap:10px}
.rx .restc .rc button{width:40px;height:34px;font-size:18px}
.rx .restc .rc span{min-width:64px;text-align:center}
.rx div{background:var(--surface-2);border-radius:10px;padding:7px 9px;min-width:0}
.rx small{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.rx span{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.1;display:block;overflow-wrap:anywhere}
.note{font-size:13px;color:var(--muted)}
.hist{font-size:13px;color:var(--muted)}
.hist b{color:var(--ink)}
.up{display:inline-block;font-size:12px;font-weight:700;color:var(--ok);background:var(--ok-soft);padding:2px 8px;border-radius:6px;margin-left:4px}
.sets{display:flex;gap:8px;flex-wrap:wrap}
.set{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:transparent;font-weight:700;font-size:14px;cursor:pointer;display:grid;place-items:center}
.set.on{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.log{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.step button{border:0;background:var(--surface-2);width:36px;height:40px;font-size:18px;font-weight:700;cursor:pointer}
.step input{width:62px;height:40px;border:0;background:transparent;text-align:center;font-weight:700;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.reps{width:64px;height:42px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:center;font-weight:700;font-size:16px;color:var(--ink)}
.lbl{font-size:12px;color:var(--muted);font-weight:600}
.btn{border:0;border-radius:10px;height:42px;padding:0 14px;font-weight:700;background:var(--acc);color:var(--plate-ink);cursor:pointer}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.saved{background:var(--ok);color:var(--surface)}
.block-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:6px}
.block-title span{font-size:12.5px;color:var(--muted)}

.rest-day{text-align:left}
.rest-day p{margin:0}

/* weights table */
.tbl-wrap{overflow-x:auto;margin:0 -14px;padding:0 14px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 6px 6px 0;font-weight:700;border-bottom:1px solid var(--line)}
td{padding:9px 6px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
th.n{text-align:right}
td .sub{display:block;font-size:12px;color:var(--muted)}
.muted{color:var(--muted)}
p{margin:0}
.lead{font-size:14px;color:var(--muted)}
.rule-list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
input[type=date]{height:42px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--surface);color:var(--ink);font:inherit}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--acc)}

/* rest timer */
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:9;width:min(528px,calc(100% - 32px));
  background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.timer .t{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;min-width:84px}
.timer .lab{flex:1;font-size:13px;min-width:0}
.body-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.body-stats div{background:var(--surface-2);border-radius:10px;padding:7px 9px;min-width:0}
.body-stats small{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;line-height:1.2}
.body-stats span{display:block;font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.15}
.body-stats em{font-style:normal;font-size:11.5px;color:var(--muted)}
.linkbtn{border:0;background:none;padding:0;color:var(--acc);font-weight:700;font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.editbox{border-color:var(--acc)}
.edit-row{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.edit-row .ex-title{min-width:0;flex:1 1 180px}
.edit-btns{display:flex;gap:6px;flex-wrap:wrap;margin-left:34px}
.ib{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;height:34px;min-width:34px;padding:0 10px;font-weight:700;font-size:13px;cursor:pointer}
.ib:disabled{opacity:.35;cursor:default}
.ib.del{color:var(--plate-b)}
.exform{background:var(--surface-2);border-color:var(--acc)}
.fl{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
.fl input,.fl select{height:42px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px;width:100%;min-width:0}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.rc{display:flex;align-items:center;justify-content:space-between;gap:2px;margin-top:2px}
.rc span{font-size:17px!important}
.rc button{border:0;background:var(--surface);border-radius:7px;width:24px;height:26px;font-weight:800;font-size:15px;cursor:pointer;flex:none;padding:0}
.pay-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pay-date{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.1}
.pay.soon{border-color:var(--warn-ink);background:var(--warn-soft)}
.pay.soon .pay-chip{background:var(--warn-ink);color:var(--surface)}
.pay.late{border-color:var(--plate-b)}
.pay.late .pay-chip{background:var(--plate-b);color:var(--plate-ink)}
.timer .lab{font-size:12.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.timer button{padding:9px 10px!important;}
.timer button{border:0;border-radius:10px;padding:9px 12px;font-weight:700;background:color-mix(in srgb,var(--bg) 18%,transparent);color:var(--bg);cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));z-index:11;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600}
@media (prefers-reduced-motion:no-preference){.set,.btn{transition:background .15s,border-color .15s}}
</style>

<div class="wrap" id="app">
  <header class="top" id="top">
    <div class="plate" id="plate"><b>A</b><i>20</i></div>
    <div class="meta">
      <div class="eyebrow" id="topEyebrow">Lunes · 7:00 AM</div>
      <h1 id="topTitle">Cuádriceps + pantorrilla</h1>
    </div>
  </header>
  <main id="view" class="wrap"></main>
</div>

<div class="timer" id="timer" hidden>
  <div class="t tnum" id="timerT">1:30</div>
  <div class="lab" id="timerLab">Descanso</div>
  <button type="button" id="timerSub">−15</button>
  <button type="button" id="timerAdd">+15</button>
  <button type="button" id="timerSkip">Listo</button>
</div>
<div class="toast" id="toast" hidden></div>

    <button type="button" data-tab="pesos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19h16M6 16l4-5 3 3 5-7"/></svg>Mis pesos</button>

  </div>
</nav>

<script>
"use strict";
/* ---------- Program data ---------- */
// src: r = registro de tu plan 2021 · s = peso sugerido para empezar · pc = peso corporal
function E(id,n,m,a,s,r,d,kg,src,tip,nw){return {id,n,m,a,s,r,d,kg,src,tip:tip||"",nw:!!nw};}
const WARM = {n:"Calentamiento",txt:"5 min de bicicleta + movilidad de cadera y hombros + 2 series ligeras del primer ejercicio."};

const ROUTINES = {
 A:{key:"A",name:"Rutina A · Base",plate:"20",focus:"Hipertrofia",rule:"8–12 reps · deja 1–2 reps en reserva · descanso 60–120 s",

   {t:"Cuádriceps + pantorrilla",ex:[

    E("pant_prensa","Pantorrilla en prensa","45° Leg Press","",3,"15–20",60,60,"r","Solo las puntas en el borde del plato."),
   ],core:[
    E("plancha","Plancha frontal","Colchoneta","",3,"45 s",45,null,"pc"),

   ],cardio:E("caminadora","Caminadora con inclinación","Treadmill","Caminadora",1,"15 min",0,null,"pc","Inclinación 8–10 %, 5–5,5 km/h.")},
   {t:"Espalda + bíceps",ex:[
    E("dom_prono","Dominadas pronas","Barra fija / Assisted Chin-Dip","Máquina asistida si hace falta",4,"al fallo",120,null,"pc","Con 12 limpias, agrega lastre."),
    E("jalon","Jalón al pecho","Lat Pulldown","Polea alta, barra larga",4,"10–12",90,50,"r"),
    E("remo_sent","Remo sentado en polea","Seated Row","Remo bajo en polea",4,"10–12",90,50,"r","Pecho arriba, junta escápulas al final."),

    E("curl_barra","Curl de bíceps con barra Z","Barra Z","Barra recta",3,"10",75,20,"s"),
    E("curl_manc","Curl alterno sentado con mancuernas","Mancuernas + banco","",4,"10",75,12,"r","Peso por mano."),
    E("martillo_polea","Curl martillo en polea","Cable · cuerda, polea baja","",3,"12",60,20,"s","",true),
   ],core:[
    E("crunch_maq","Crunch abdominal en máquina","Abdominal Crunch","Crunch en colchoneta",3,"15",60,30,"s","",true),
    E("plancha_lat","Plancha lateral","Colchoneta","",3,"30 s c/lado",45,null,"pc"),
   ],cardio:E("eliptica","Elíptica","Elliptical / Ascent Trainer","Elíptica",1,"15 min",0,null,"pc","Ritmo moderado, que puedas hablar.")},
   {t:"Hombro + trapecio + antebrazo",ex:[
    E("lat_calent","Elevaciones laterales de calentamiento","Mancuernas","",2,"15",45,4,"s"),

function editableEx(key){if(!Array.isArray(state.custom[key])){const [rk,di]=key.split("-");state.custom[key]=JSON.parse(JSON.stringify(ROUTINES[rk].days[Number(di)].ex));}return state.custom[key];}
function catalog(){
  const m=new Map();
  for(const k of ORDER) ROUTINES[k].days.forEach(d=>d.ex.forEach(e=>{if(!m.has(e.id))m.set(e.id,e);}));
  for(const arr of Object.values(state.custom||{})) (arr||[]).forEach(e=>{if(e&&!m.has(e.id))m.set(e.id,e);});
  return [...m.values()].sort((a,b)=>a.n.localeCompare(b.n,"es"));
}
let editKey=null, formAt=null;
function restOf(e){const v=state.rest&&state.rest[e.id];return (v!=null)?v:e.d;}
let dbDoc=null, writing=false, pendingWrite=false, saveTimer=null;

function persist(){
  state.updatedAt=Date.now();
  pruneChecks();
  try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){}
  if(!dbDoc) return;
  clearTimeout(saveTimer); saveTimer=setTimeout(flush,900);
}
async function flush(){
  if(!dbDoc) return;
  if(writing){pendingWrite=true;return;}
  writing=true;
  try{await dbDoc.set(JSON.parse(JSON.stringify(state)));}
  catch(e){ if(e&&e.code==="unavailable"){ setTimeout(flush,1500+Math.random()*1000); } }
  writing=false;
  if(pendingWrite){pendingWrite=false;flush();}
}
function pruneChecks(){
  const cutoff=dkey(addDays(new Date(),-10));
  for(const k of Object.keys(state.checks)) if(k<cutoff) delete state.checks[k];
  for(const id of Object.keys(state.logs)){ if(state.logs[id].length>40) state.logs[id]=state.logs[id].slice(-40); }
}
async function connectDb(){
  try{
    if(!window.claude||!window.claude.use) return;
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user) return;
    const uid=await user.id(); if(!uid) return;
    dbDoc=db.doc("data/users/"+uid+"/plan");
    const snap=await dbDoc.get();
    if(snap.exists){
      const remote=snap.data();
      if(remote&&remote.v===1&&(remote.updatedAt||0)>(state.updatedAt||0)){
        state=JSON.parse(JSON.stringify(remote)); normalize();
        try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){}
        render();
      }else if((state.updatedAt||0)>(remote&&remote.updatedAt||0)){ flush(); }
    }else if(state.updatedAt){ flush(); }
  }catch(e){ dbDoc=null; }
}

/* ---------- Dates & cycle ---------- */
function pad(n){return String(n).padStart(2,"0");}
function dkey(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function parseKey(k){const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d);}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const wd=(x.getDay()+6)%7;return addDays(x,-wd);}
function fmtShort(k){const d=parseKey(k);return d.getDate()+" "+MONTHS[d.getMonth()];}
function cycleFor(date){
  const start=mondayOf(parseKey(state.start||DEFAULT_START));
  const weeks=Math.round((mondayOf(date)-start)/(7*864e5));
  const block=((Math.floor(weeks/2)%3)+3)%3;
  const wk=((weeks%2)+2)%2+1;
  return {key:ORDER[block],week:wk,weeks};
}
function setAccent(rk){document.documentElement.style.setProperty("--acc","var("+PLATE_VAR[rk]+")");}

/* ---------- Helpers ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function kgFmt(n){return (Math.round(n*10)/10).toString().replace(".",",");}
function topReps(r){const m=String(r).match(/\d+/g);return m?Math.max(...m.map(Number)):null;}
function lastLog(id){const l=state.logs[id];return l&&l.length?l[l.length-1]:null;}
function bestLog(id){const l=state.logs[id];if(!l||!l.length)return null;return l.reduce((b,x)=>(x.kg||0)>(b.kg||0)?x:b,l[0]);}
function workKg(e){const l=lastLog(e.id);if(l&&l.kg!=null)return l.kg;return e.kg;}
function restFmt(s){if(!s)return "0 s";if(s<60)return s+" s";const m=Math.floor(s/60),r=s%60;return r?m+":"+pad(r)+" min":m+" min";}
function estMinutes(day){
  let sec=0,n=0;
  for(const e of [...day.ex,...day.core]){const uni=/c\//.test(e.r)?1.6:1;sec+=e.s*(45*uni+restOf(e));n++;}
  const cardio=parseInt(day.cardio.r)||15;
  return Math.round(10+sec/60+n*1.5+cardio);
}

function daysUntil(k){const t=new Date();const a=new Date(t.getFullYear(),t.getMonth(),t.getDate());return Math.round((parseKey(k)-a)/864e5);}

function addMonth(k){const d=parseKey(k);const day=d.getDate();const x=new Date(d.getFullYear(),d.getMonth()+1,1);const last=new Date(x.getFullYear(),x.getMonth()+1,0).getDate();x.setDate(Math.min(day,last));return dkey(x);}
function bodySorted(){return (state.body||[]).slice().sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);}
function signed(n){const r=Math.round(n*10)/10;return (r>0?"+":r<0?"−":"±")+kgFmt(Math.abs(r));}
function niceStep(range){const raw=range/4;const p=Math.pow(10,Math.floor(Math.log10(raw)));for(const m of [1,2,2.5,5,10]) if(m*p>=raw) return m*p;return 10*p;}
function bodyChart(arr){
  if(arr.length<2) return '<p class="note">'+(arr.length?'Con tu siguiente registro aparece la gráfica.':'Registra tu peso una vez por semana, idealmente el lunes en ayunas, y aquí verás cómo va cambiando.')+'</p>';
  const W=340,H=190,L=38,R=14,T=16,B=26;
  const xs=arr.map(p=>parseKey(p.d).getTime()), ys=arr.map(p=>p.kg);
  let y0=Math.min(...ys), y1=Math.max(...ys); if(y1-y0<2){const m=(y0+y1)/2;y0=m-1;y1=m+1;}
  const step=niceStep(y1-y0); y0=Math.floor(y0/step)*step; y1=Math.ceil(y1/step)*step;
  const x0=xs[0], x1=xs[xs.length-1]===x0?x0+864e5:xs[xs.length-1];
  const X=t=>L+(t-x0)/(x1-x0)*(W-L-R), Y=v=>T+(y1-v)/(y1-y0)*(H-T-B);
  let g='';
  for(let v=y0;v<=y1+1e-9;v+=step){const y=Y(v).toFixed(1);g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-6)+'" y="'+(+y+4)+'" text-anchor="end" font-size="10.5" fill="var(--muted)">'+kgFmt(v)+'</text>';}
  const pts=arr.map((p,i)=>[X(xs[i]),Y(p.kg)]);
  const line=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  const area=line+' L'+pts[pts.length-1][0].toFixed(1)+' '+(H-B)+' L'+pts[0][0].toFixed(1)+' '+(H-B)+' Z';
  const lab=(t,anchor,x)=>{const d=new Date(t);return '<text x="'+x.toFixed(1)+'" y="'+(H-8)+'" text-anchor="'+anchor+'" font-size="10.5" fill="var(--muted)">'+d.getDate()+' '+MONTHS[d.getMonth()]+'</text>';};
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Gráfica de peso corporal" style="display:block;overflow:visible">';
  s+=g+'<path d="'+area+'" fill="var(--acc)" fill-opacity=".12" stroke="none"/><path d="'+line+'" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  pts.forEach((q,i)=>{const last=i===pts.length-1;s+='<circle cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="'+(last?5:3)+'" fill="'+(last?'var(--acc)':'var(--surface)')+'" stroke="var(--acc)" stroke-width="2"/>';});
  const lq=pts[pts.length-1]; s+='<text x="'+Math.min(lq[0],W-R).toFixed(1)+'" y="'+Math.max(lq[1]-10,11).toFixed(1)+'" text-anchor="end" font-size="12" font-weight="700" fill="var(--ink)">'+kgFmt(arr[arr.length-1].kg)+' kg</text>';
  s+=lab(xs[0],'start',L)+lab(xs[xs.length-1],'end',W-R)+'</svg>';
  return s;
}

  return h;
}

/* ---------- Rest timer ---------- */
let tEnd=0,tInt=null;
const timerEl=document.getElementById("timer"),timerT=document.getElementById("timerT"),timerLab=document.getElementById("timerLab");
function startRest(sec,label){
  if(!sec) return;
  tEnd=Date.now()+sec*1000; timerLab.textContent=label; timerEl.hidden=false; tick();
  clearInterval(tInt); tInt=setInterval(tick,250);
}
function tick(){
  const left=Math.max(0,Math.round((tEnd-Date.now())/1000));
  timerT.textContent=Math.floor(left/60)+":"+pad(left%60);
  if(left<=0){clearInterval(tInt);timerLab.textContent="¡A la siguiente serie!";try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){} setTimeout(()=>{if(Date.now()>=tEnd)timerEl.hidden=true;},4000);}
}
document.getElementById("timerAdd").onclick=()=>{tEnd=Math.max(tEnd,Date.now())+15000;timerEl.hidden=false;clearInterval(tInt);tInt=setInterval(tick,250);tick();};
document.getElementById("timerSub").onclick=()=>{tEnd=Math.max(Date.now(),tEnd-15000);tick();};
document.getElementById("timerSkip").onclick=()=>{clearInterval(tInt);timerEl.hidden=true;};

function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,1800);}

/* ---------- Events ---------- */
function findEx(id){
  for(const arr of Object.values(state.custom||{})) for(const e of (arr||[])) if(e&&e.id===id) return e;
  for(const k of ORDER)for(const d of ROUTINES[k].days){for(const e of [...d.ex,...d.core,d.cardio]) if(e.id===id) return e;}return null;}
function currentDayEx(id){
  // exercise definition in the context being shown (for rest/sets)
  if(tab==="plan"&&planSel){const d=ROUTINES[planSel.r].days[planSel.d];return [...dayEx(planSel.r,planSel.d),...d.core,d.cardio].find(e=>e.id===id)||findEx(id);}
  const now=new Date(),wd=(now.getDay()+6)%7;if(wd>5)return findEx(id);
  const k=cycleFor(now).key,d=ROUTINES[k].days[wd];return [...dayEx(k,wd),...d.core,d.cardio].find(e=>e.id===id)||findEx(id);
}
function slug(s){return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"").slice(0,24)||"ej";}
view.addEventListener("change",ev=>{
  if(ev.target.id==="importFile"){
    const file=ev.target.files&&ev.target.files[0]; if(!file) return;
    file.text().then(t=>{const s=JSON.parse(t); if(!s||s.v!==1) throw 0; state=Object.assign({v:1,start:DEFAULT_START,logs:{},checks:{},rest:{},custom:{},pay:DEFAULT_PAY},s); normalize(); persist(); render(); toast("Copia importada");})
      .catch(()=>toast("Ese archivo no es una copia del plan"));
    return;
  }
  if(ev.target.id!=="f-pick") return;
  const c=catalog().find(x=>x.id===ev.target.value);
  const set=(id,val)=>{const el=document.getElementById(id);if(el)el.value=val;};

  set("f-id",c.id);set("f-n",c.n);set("f-m",c.m);set("f-s",c.s);set("f-r",c.r);set("f-kg",c.kg!=null?kgFmt(workKg(c)):"");set("f-d",restOf(c));
});
function keepScroll(fn){const y=window.scrollY;fn();window.scrollTo(0,y);}
document.querySelector("nav.tabs").addEventListener("click",ev=>{const b=ev.target.closest("button[data-tab]");if(!b)return;tab=b.dataset.tab;render();window.scrollTo(0,0);});
view.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-act]"); if(!b) return;
  const act=b.dataset.act, card=b.closest(".ex"), id=card&&card.dataset.id;
  if(act==="set"){
    const dk=dkey(new Date()), n=Number(b.dataset.n), e=currentDayEx(id);
    state.checks[dk]=state.checks[dk]||{};

    state.checks[dk][id]=next; persist();
    const y=window.scrollY; render(); window.scrollTo(0,y);
    if(next>cur&&e){
      const left=e.s-next, rs=restOf(e);
      if(left>0) startRest(rs,"Quedan "+left+" serie"+(left===1?"":"s")+" · "+e.n);
      else if(rs) startRest(rs,"Ejercicio completo · descansa y pasa al siguiente");

    const arr=editableEx(b.dataset.key),i=Number(b.dataset.i),j=i+(act==="mvUp"?-1:1);

  }else if(act==="del"){

  }else if(act==="swap"){formAt=Number(b.dataset.i);keepScroll(render);

  }else if(act==="formCancel"){formAt=null;keepScroll(render);
  }else if(act==="resetDay"){delete state.custom[b.dataset.key];persist();editKey=null;formAt=null;keepScroll(render);toast("Día original restaurado");

    const ex={id,n,m:m||"—",a:sameAsBase?(base.a||""):"",s,r,d,kg:kg==null?null:Math.round(kg*10)/10,src:sameAsBase?base.src:(kg==null?"pc":"s"),tip:sameAsBase?(base.tip||""):"",nw:sameAsBase?!!base.nw:true};
    const arr=editableEx(b.dataset.key);

    formAt=null; persist(); keepScroll(render); toast(b.dataset.i==="new"?"Ejercicio agregado":"Ejercicio cambiado");
  }else if(act==="exportData"){

    const file=new File([blob],name,{type:"application/json"});
